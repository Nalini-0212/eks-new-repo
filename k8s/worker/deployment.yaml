apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: production
spec:
  replicas: 2

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
      - name: worker

        image: 623740184460.dkr.ecr.ap-south-1.amazonaws.com/worker:latest

        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: database-url

        - name: POLL_INTERVAL_MS
          value: "3000"

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"

        livenessProbe:
          exec:
            command:
            - pgrep
            - node
          initialDelaySeconds: 30
          periodSeconds: 20

        readinessProbe:
          exec:
            command:
            - pgrep
            - node
          initialDelaySeconds: 10
          periodSeconds: 10
